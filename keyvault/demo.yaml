apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: demo-kv
  namespace: secrets-demo
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "9dfecc6e-d1fa-4798-bc1b-e258f9571abe"
    keyvaultName: "kv-ump-ktashiq4240"
    tenantId: "4b8a22a9-cb6e-41d0-93ce-58e8fd6dfceb"
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
  secretObjects:
    - secretName: demo-secrets
      type: Opaque
      data:
        - objectName: db-password
          key: DB_PASSWORD
---
apiVersion: v1
kind: Pod
metadata:
  name: kv-demo
  namespace: secrets-demo
spec:
  containers:
    - name: demo
      image: busybox:1.36
      command: ["sleep", "3600"]
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: demo-secrets
              key: DB_PASSWORD
      volumeMounts:
        - name: secrets
          mountPath: /mnt/secrets
          readOnly: true
  volumes:
    - name: secrets
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: demo-kv
