name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_VERSION: "0.69.3"
  GITLEAKS_VERSION: ""
  ACR_NAME: ktashiqacr02
  IMAGE_NAME: ump-tomcat
  RESOURCE_GROUP: tfdevops-rg
  AKS_NAME: tfdevops-aks
  NAMESPACE: ump-gha

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:${GITLEAKS_VERSION} dir /repo --redact -v

      - name: Misconfiguration scan (Trivy)
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:${TRIVY_VERSION} config --severity HIGH --exit-code 0 .
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:${TRIVY_VERSION} config --severity CRITICAL --exit-code 1 .

      - name: Image vulnerability scan (Trivy)
        run: |
          docker build -t ump-scan:${GITHUB_SHA} .
          docker save ump-scan:${GITHUB_SHA} -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP:/work" aquasec/trivy:${TRIVY_VERSION} image --input /work/image.tar --severity CRITICAL --ignore-unfixed --exit-code 1

  build:
    needs: security
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate XML
        run: python3 -c "import glob, xml.dom.minidom as m; [m.parse(f) for f in glob.glob('conf/*.xml')]"

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr login --name "$ACR_NAME"
          docker build -t "$ACR_NAME.azurecr.io/$IMAGE_NAME:${GITHUB_SHA}" .
          docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:${GITHUB_SHA}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy with Helm
        run: |
          az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$AKS_NAME" --overwrite-existing
          helm upgrade --install ump helm/ump --namespace "$NAMESPACE" --create-namespace -f helm/ump/values-prod.yaml --set image.tag="${GITHUB_SHA}" --wait --timeout 5m
          kubectl get pods -n "$NAMESPACE"
