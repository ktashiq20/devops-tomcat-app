apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ump
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ktashiq20/devops-tomcat-app.git
    targetRevision: main
    path: helm/ump
    helm:
      valueFiles:
        - values-aks.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ump
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
